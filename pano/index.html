<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David Reed nerede?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --trayw: clamp(190px, 24vw, 360px); --fog:#9fb3ad; }
  html, body { margin:0; height:100%; background:#0b0d0e; overflow:hidden; font-family: Georgia, "Times New Roman", serif; color:#e8efe9; }
  #stage { position:fixed; left:0; top:0; bottom:0; right:var(--trayw); display:flex; align-items:center; justify-content:center; }
  #scene { --sw: min(calc(100vw - var(--trayw)), calc(100vh * 1280 / 853)); position:relative; width:var(--sw); aspect-ratio:1280/853; }
  #scene > img.bg { position:absolute; inset:0; width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; }

  /* centre of the board: David + the note */
  .fixed { position:absolute; user-select:none; -webkit-user-drag:none; filter: drop-shadow(2px 5px 7px rgba(0,0,0,.6)); }
  .fixed img { width:100%; display:block; -webkit-user-drag:none; }
  #david { left:42%; top:37%; width:6.6%; transform:rotate(-2deg); cursor:zoom-in; z-index:3; }
  #nreed { left:49.6%; top:38.6%; width:8.4%; transform:rotate(-5deg); pointer-events:none; z-index:3; }

  /* drop places */
  .slot { position:absolute; border:2px dashed rgba(255,240,215,.26); border-radius:3px; box-sizing:border-box; transition:background .15s, border-color .15s, opacity .6s; z-index:4; }
  .slot.note, .slot.hyp { background:rgba(246,226,124,.05); }
  .slot.hot { border-color:rgba(255,236,170,.85); background:rgba(255,236,170,.14); }
  .slot.filled { border-color:transparent; background:none; }
  .slot.s2 { display:none; opacity:0; }
  #scene.s2on .slot.s2 { display:block; }
  #scene.s2show .slot.s2 { opacity:1; }

  /* evidence tray (separate compartment) */
  #tray { --rows:3; position:fixed; top:0; right:0; bottom:0; width:var(--trayw); box-sizing:border-box; padding:14px 12px; z-index:5; overflow-y:auto;
          background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,0) 14px), repeating-linear-gradient(92deg, #3b2717 0 7px, #432c1a 7px 15px, #362314 15px 22px);
          box-shadow: inset 0 0 40px rgba(0,0,0,.75); display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(var(--rows), 1fr); gap:12px; }
  .cell { position:relative; display:flex; align-items:center; justify-content:center; min-height:0; overflow:visible; }

  /* evidence pieces */
  .item { position:relative; cursor:grab; touch-action:none; user-select:none; -webkit-user-drag:none; box-sizing:border-box; }
  .item[data-locked] { cursor:zoom-in; }
  .cell > .item { width:100%; }
  .slot > .item { width:100%; height:100%; }
  .item.ph img { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; filter: drop-shadow(2px 4px 6px rgba(0,0,0,.65)); }
  .cell > .item.ph img { height:auto; max-height:calc((100vh - 28px - (var(--rows) - 1) * 12px) / var(--rows) - 6px); }
  .item.nt { background:#f6e27c; color:#2a2414; font-family:'Caveat', 'Segoe Print', 'Comic Sans MS', cursive; font-weight:700; line-height:1.1;
             padding:6% 7%; box-shadow:2px 4px 8px rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; text-align:center;
             transform:rotate(-1.5deg); overflow:hidden; }
  .item.nt.hyp { background:#9fd9f2; color:#14232a; transform:rotate(1.2deg); }
  .item.dragging { position:fixed !important; z-index:100; cursor:grabbing; pointer-events:none; transform:rotate(-3deg) scale(1.03); }
  .slot > .item::before, #david::before, #nreed::before { content:""; position:absolute; left:50%; top:-2%; width:calc(var(--sw) * 0.0095); height:calc(var(--sw) * 0.0095);
     transform:translate(-50%, -30%); border-radius:50%; background: radial-gradient(circle at 35% 35%, #ff8a8a, #b5121b 60%, #5a0408); box-shadow:1px 2px 3px rgba(0,0,0,.6); z-index:3; }
  .shake { animation: shake .45s; }
  @keyframes shake { 0%,100%{translate:0} 20%{translate:-6px} 40%{translate:6px} 60%{translate:-4px} 80%{translate:4px} }

  /* red threads (pin to pin) */
  #threads { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; }
  #threads line { stroke:#b3121c; stroke-width:.28; stroke-linecap:round; stroke-dasharray:120; stroke-dashoffset:120; transition: stroke-dashoffset 1.4s ease;
                  filter: drop-shadow(0 .15px .2px rgba(0,0,0,.7)); }
  #threads line.on { stroke-dashoffset:0; }

  /* lightning: the whole board lights up for a moment */
  #flash { position:absolute; inset:0; z-index:9; pointer-events:none; opacity:0; background: radial-gradient(ellipse at 40% 20%, rgba(235,242,255,.95), rgba(190,205,240,.75) 70%); mix-blend-mode:screen; }
  #flash.go { animation: bolt .9s ease-out; }
  @keyframes bolt { 0%{opacity:0} 6%{opacity:.85} 14%{opacity:.08} 24%{opacity:.6} 40%{opacity:.12} 55%{opacity:.3} 100%{opacity:0} }

  /* heroine's comment, like on the other pages */
  #thought { position:absolute; left:50%; bottom:4%; transform:translateX(-50%); max-width:74%; display:none; z-index:8;
             font-size:calc(var(--sw) * 0.0145); font-style:italic; color:#1b1b1b; background:#fff; padding:.7% 1.3%;
             border-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.55); text-align:center; pointer-events:none; }
  #thought.on { display:block; animation: fade 1s ease; }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }

  /* "evaluate the conclusions" button on the desk */
  #evalbtn { position:absolute; left:50%; bottom:11.5%; transform:translateX(-50%); z-index:8; display:none; cursor:pointer;
             font: italic calc(var(--sw) * 0.0155) Georgia, serif; color:#f3e6cf; letter-spacing:.04em; padding:.75% 2.2%;
             background: linear-gradient(#5a3b22, #3c2615); border:1px solid #c9a46a; border-radius:3px; box-shadow:0 3px 12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,230,180,.25); }
  #evalbtn:hover { background: linear-gradient(#6c4829, #472d19); }
  #evalbtn.on { display:block; animation: fade 1s ease; }

  /* the sheet of paper with the conclusions */
  #paper { position:fixed; inset:0; z-index:160; display:none; align-items:center; justify-content:center; background: rgba(4,4,4,.82); }
  #paper.on { display:flex; animation: fade .6s ease; }
  #sheet { position:relative; width:min(92vw, 780px); max-height:94vh; overflow-y:auto; box-sizing:border-box; padding:5.5% 6% 5% 12%;
           font-family:'Caveat', 'Segoe Print', cursive; font-weight:500; color:#1d2a4a; font-size:clamp(15px, min(2.3vw, 2.75vh), 26px); line-height:1.32;
           background:
             linear-gradient(90deg, transparent calc(8.5% - 1px), rgba(205,60,60,.55) calc(8.5% - 1px), rgba(205,60,60,.55) calc(8.5% + 1px), transparent calc(8.5% + 1px)),
             repeating-linear-gradient(180deg, transparent 0, transparent calc(1.32em - 1px), rgba(80,120,190,.28) calc(1.32em - 1px), rgba(80,120,190,.28) 1.32em),
             #fbf7ea;
           box-shadow: 0 10px 40px rgba(0,0,0,.7); transform:rotate(-.6deg); }
  #sheet ol { list-style:none; margin:0; padding:0; }
  #sheet li { position:relative; display:flex; align-items:flex-start; gap:.55em; margin:0 0 .66em; cursor:pointer; user-select:none; }
  #sheet .cb { flex:0 0 auto; width:.95em; height:.95em; margin-top:.22em; border:2px solid #24345c; border-radius:2px; position:relative; transform:rotate(-2deg); }
  #sheet .cb svg { position:absolute; left:-.15em; top:-.45em; width:1.45em; height:1.45em; overflow:visible; }
  #sheet .cb path { fill:none; stroke:#b3121c; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:40; stroke-dashoffset:40; transition: stroke-dashoffset .35s ease; }
  #sheet li.on .cb path { stroke-dashoffset:0; }
  #sheet .no { flex:0 0 auto; min-width:1.4em; color:#3a4a73; }

  #gate { position:fixed; inset:0; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, rgba(32,24,18,.93), rgba(6,5,4,.98)); cursor:pointer; text-align:center; padding:20px; }
  #gate h1 { font-weight:normal; letter-spacing:.12em; font-size: clamp(26px,5vw,48px); margin:0 0 28px; color:#efe4d6; }
  #gate p { color:var(--fog); font-style:italic; margin:0; font-size:15px; opacity:.85; }
  #gate.off { opacity:0; pointer-events:none; transition:opacity 1.2s; }
  #mute { position:fixed; left:16px; bottom:14px; z-index:170; font-size:22px; cursor:pointer; opacity:.7; user-select:none; }
</style>
</head>
<body>
<div id="stage"><div id="scene">
  <img class="bg" src="board.jpg?v=2" alt="">
  <svg id="threads" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <div class="fixed" id="david"><img src="david.jpg?v=2" alt="David Reed"></div>
  <div class="fixed" id="nreed"><img src="note.png?v=2" alt="DAVİD REED NEREDE?"></div>
  <div id="thought"></div>
  <div id="evalbtn">Çıkarımları değerlendir</div>
  <div id="flash"></div>
</div></div>
<div id="tray"></div>
<div id="zoom"><img alt=""><div class="bignote"></div></div>
<div id="paper"><div id="sheet"><ol></ol></div></div>
<div id="mute" title="Ses">🔊</div>
<div id="gate"><h1>David Reed nerede?</h1><p>Girmek için tıklayın 🔊</p></div>
<style>
  #zoom { position:fixed; inset:0; z-index:150; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); cursor:zoom-out; }
  #zoom.on { display:flex; }
  #zoom img { max-width:min(46vw, 620px); max-height:58vh; filter: drop-shadow(4px 8px 16px rgba(0,0,0,.7)); animation: zin .18s ease-out; }
  #zoom.doc img { max-width:min(74vw, 1100px); max-height:88vh; }
  #zoom .bignote { display:none; max-width:min(44vw, 520px); padding:26px 30px; background:#f6e27c; color:#2a2414; font-family:'Caveat', 'Segoe Print', cursive;
                   font-weight:700; font-size:clamp(20px, 2.2vw, 30px); line-height:1.2; text-align:center; box-shadow:4px 8px 18px rgba(0,0,0,.6); transform:rotate(-1.5deg); animation: zin .18s ease-out; }
  #zoom .bignote.hyp { background:#9fd9f2; color:#14232a; transform:rotate(1.2deg); }
  #zoom.note img { display:none; }
  #zoom.note .bignote { display:block; }
  @keyframes zin { from { transform:scale(.85); opacity:.4 } to { opacity:1 } }
</style>
<script>
/* Page 5 (Maria 08.10).
   Stage 1: 3 photos on the lower part of the board (left -> right in story order) + the matching
   yellow note under each. Stage 2: group the evidence into three zones and put the right blue
   hypothesis on each. Correct groups get red threads (pin to pin). Then "Çıkarımları değerlendir"
   opens a sheet of paper with 9 statements to tick / untick.
   ?stage=2 opens stage 2 directly, ?stage=3 opens the sheet. */

/* ---------------- stage 1 ---------------- */
const S1_PHOTOS = [
  { id:'motel', src:'motel.jpg?v=2' },
  { id:'room',  src:'room.png?v=2' },
  { id:'cliff', src:'cliff.png?v=2' },
];
const S1_NOTES = [
  { id:'motel', text:"David'in son kaldığı yer. Bu Pazartesi saat 08.17'de ayrıldı." },
  { id:'room',  text:"David'in kıyafetleri ve kişisel eşyaları odada kaldı. Görünüşe göre otelden tamamen ayrılmayı planlamıyordu." },
  { id:'cliff', text:"David'in eşyaları, kan izleri ve boğuşma belirtileri burada bulundu." },
];
const S1_DONE = "David'in izini uçurumda kaybettik. Ancak cesedi bulunamadı.";
const S1_COLS = [26, 49.75, 73.5];
const S1_PHOTO = { top:52.5, w:11, h:11 }, S1_NOTE = { top:65, w:17, h:13 };

/* ---------------- stage 2 ---------------- */
const S2_EVIDENCE = [
  { id:'pendant', g:1, src:'s2_pendant.png' },
  { id:'city',    g:1, src:'s2_city.jpg' },
  { id:'door',    g:1, src:'s2_door.jpg' },
  { id:'bald',    g:2, src:'s2_bald.png' },
  { id:'letter',  g:2, src:'s2_letter.jpg', doc:true },
  { id:'news',    g:3, src:'s2_news.jpg', doc:true },
  { id:'sarah',   g:3, src:'s2_sarah.jpg' },
];
const S2_HYP = [
  { g:1, text:"İtalya'da gizli bir örgüt mü faaliyet gösteriyor? David ve Nathan'ı onlar mı ortadan kaldırdı?" },
  { g:2, text:"Nathan, David'in araştırmalarını finanse ediyordu. Ölümcül hastalığı yüzünden ölümsüzlüğün peşine düşmüş olabilir mi?" },
  { g:3, text:"Sarah da yıllar önce ormanda esrarengiz bir şekilde kaybolmuştu. İki olay arasında bir bağlantı olabilir mi?" },
];
const S2_DONE = "Bütün ipuçlarını bir araya getirdim.";
const S2_ZONES = [                    // % of the scene; cork is ~10.5..89 x 10..80
  { id:'A', xs:[40, 49.75, 59.5], top:12, w:9,   h:11.5, hyp:{ left:38.75, top:25, w:22,   h:10.8 } },
  { id:'B', xs:[16.75, 26.75],    top:13, w:9.5, h:13,   hyp:{ left:12,    top:29, w:19.5, h:14 } },
  { id:'C', xs:[72.75, 82.75],    top:13, w:9.5, h:13,   hyp:{ left:68,    top:29, w:19.5, h:14 } },
];

/* ---------------- the sheet ---------------- */
const STATEMENTS = [
  "Motelin çatısındaki siluet, David'i takip eden kişiye ait olabilir.",
  "Sarah'nın yıllar önce kaybolmasıyla David'in kayboluşu arasında bir bağlantı olabilir.",
  "David'in fotoğraf makinesi, kayboluşuyla ilgili önemli bir kanıt içermiş olabilir.",
  "Volterra'daki gizemli bir örgüt, David'in kayboluşuyla bağlantılı olabilir.",
  "David ve Nathan aynı örgütün hedefi olmuş olabilir.",
  "David Reed intihar etmiş olabilir.",
  "Nathan, David'in araştırmalarının tehlikeli olabileceğinin farkındaydı.",
  "Nathan, David'in araştırmalarını kendi amaçları için kullanmış olabilir.",
  "David'in araştırdığı kişiler, onun kendileri hakkında bilgi topladığını öğrenmiş olabilir.",
];

const scene = document.getElementById('scene'), tray = document.getElementById('tray'), threadsSvg = document.getElementById('threads');
const zoom = document.getElementById('zoom'), zimg = zoom.querySelector('img'), znote = zoom.querySelector('.bignote'), thought = document.getElementById('thought');
const david = document.getElementById('david');
let muted = false, stage = 1;
const links = [];                       // red threads: [elementA, elementB], declared before the first refresh()
function play(name) { if (muted) return; try { new Audio(name).play().catch(() => {}); } catch (e) {} }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- storm ambience + lightning ---------- */
const STORM_VOL = .45;
const storm = new Audio('storm.mp3'); storm.loop = true; storm.volume = 0;
function startStorm() {
  storm.play().then(() => { let v = 0; const t = setInterval(() => { v = Math.min(STORM_VOL, v + .03); storm.volume = muted ? 0 : v; if (v >= STORM_VOL) clearInterval(t); }, 150); }).catch(() => {});
}
const flash = document.getElementById('flash');
function lightning() {
  if (!document.hidden) { flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); }
  setTimeout(lightning, 30000 + Math.random() * 10000);            // every 30-40 s
}

/* ---------- board places ---------- */
const slots = [];
function addSlot(kind, rect, extra) {
  const s = document.createElement('div'); s.className = 'slot ' + kind + (extra && extra.cls ? ' ' + extra.cls : ''); s.dataset.kind = kind;
  Object.entries(extra || {}).forEach(([k, v]) => { if (k !== 'cls') s.dataset[k] = v; });
  Object.assign(s.style, { left: rect.left + '%', top: rect.top + '%', width: rect.w + '%', height: rect.h + '%' });
  scene.appendChild(s); slots.push(s); return s;
}
S1_COLS.forEach((c, i) => {
  addSlot('photo', { left: c - S1_PHOTO.w / 2, top: S1_PHOTO.top, w: S1_PHOTO.w, h: S1_PHOTO.h }, { i });
  addSlot('note',  { left: c - S1_NOTE.w / 2,  top: S1_NOTE.top,  w: S1_NOTE.w,  h: S1_NOTE.h },  { i });
});
S2_ZONES.forEach(z => {
  z.xs.forEach(x => addSlot('ev', { left: x - z.w / 2, top: z.top, w: z.w, h: z.h }, { zone: z.id, cls: 's2' }));
  addSlot('hyp', z.hyp, { zone: z.id, cls: 's2' });
});
const slotAt = (kind, i) => slots.find(s => s.dataset.kind === kind && +s.dataset.i === i);
const zoneSlots = (id, kind) => slots.filter(s => s.dataset.zone === id && s.dataset.kind === kind);

/* ---------- pieces ---------- */
const items = [];
function makePhoto(kind, id, src, data) {
  const el = document.createElement('div'); el.className = 'item ph'; el.dataset.kind = kind; el.dataset.id = id;
  Object.assign(el.dataset, data || {}); el.innerHTML = `<img src="${src}" alt="">`; items.push(el); return el;
}
function makeNote(kind, id, text, data, cls) {
  const el = document.createElement('div'); el.className = 'item nt' + (cls ? ' ' + cls : ''); el.dataset.kind = kind; el.dataset.id = id;
  Object.assign(el.dataset, data || {}); el.textContent = text; items.push(el); return el;
}
function fillTray(pieces, rows) {
  tray.innerHTML = ''; tray.style.setProperty('--rows', rows);
  shuffle(pieces.slice()).forEach(el => { const c = document.createElement('div'); c.className = 'cell'; tray.appendChild(c); c.appendChild(el); el.home = c; });
  refresh();
}
fillTray([
  ...S1_PHOTOS.map(p => makePhoto('photo', p.id, p.src)),
  ...S1_NOTES.map(n => makeNote('note', n.id, n.text)),
], 3);

/* sticky-note text always fits (board place or tray cell) */
function fit(el) {
  if (!el.classList.contains('nt') || !el.parentElement) return;
  const p = el.parentElement;
  if (p.classList.contains('slot')) {
    let fs = scene.getBoundingClientRect().width * 0.0135; el.style.fontSize = fs + 'px';
    while (fs > 5 && el.scrollHeight > el.clientHeight + 1) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
  } else if (p.classList.contains('cell')) {
    let fs = tray.getBoundingClientRect().width * 0.042; el.style.fontSize = fs + 'px';
    while (fs > 7 && el.offsetHeight > p.clientHeight - 2) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
  }
}
function refresh() { slots.forEach(s => s.classList.toggle('filled', !!s.querySelector('.item'))); items.forEach(fit); drawThreads(); }
addEventListener('resize', refresh);
function goHome(el) { el.home.appendChild(el); }

/* ---------- threads: pin to pin, recomputed on resize ---------- */
function pin(el) {
  const s = scene.getBoundingClientRect(), r = el.getBoundingClientRect();
  return [((r.left + r.width / 2) - s.left) / s.width * 100, ((r.top + r.height * 0.02) - s.top) / s.height * 100];
}
function drawThreads() {
  links.forEach(l => {
    if (!l.line) {
      l.line = document.createElementNS('http://www.w3.org/2000/svg', 'line'); threadsSvg.appendChild(l.line);
      requestAnimationFrame(() => requestAnimationFrame(() => l.line.classList.add('on')));
    }
    const [x1, y1] = pin(l.a), [x2, y2] = pin(l.b);
    Object.entries({ x1, y1, x2, y2 }).forEach(([k, v]) => l.line.setAttribute(k, v.toFixed(2)));
  });
}
function link(a, b) { links.push({ a, b }); drawThreads(); }

/* ---------- zoom ---------- */
function openZoom(el) {
  zoom.className = 'on';
  if (el.classList && el.classList.contains('nt')) {
    zoom.classList.add('note'); znote.textContent = el.textContent; znote.classList.toggle('hyp', el.classList.contains('hyp'));
  } else {
    if (el.dataset && el.dataset.doc) zoom.classList.add('doc');
    zimg.src = el.querySelector('img').getAttribute('src');
  }
}
zoom.addEventListener('click', () => { zoom.className = ''; });
addEventListener('keydown', e => { if (e.key === 'Escape') zoom.className = ''; });
david.addEventListener('click', () => openZoom(david));

/* ---------- drag & drop (a press without movement = zoom) ---------- */
let press = null, drag = null;
scene.addEventListener('pointerdown', onDown); tray.addEventListener('pointerdown', onDown);
function onDown(e) {
  const el = e.target.closest && e.target.closest('.item');
  if (!el || e.button > 0) return;
  e.preventDefault(); press = { el, x: e.clientX, y: e.clientY };
}
function startDrag() {
  const el = press.el, r = el.getBoundingClientRect();
  drag = { el, from: el.parentElement, dx: press.x - r.left, dy: press.y - r.top };
  Object.assign(el.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  document.body.appendChild(el); el.classList.add('dragging'); refresh();
  play(el.classList.contains('nt') ? '../snd_paper.mp3' : '../snd_pickup.mp3');
}
function slotUnder(x, y, kind) {
  return document.elementsFromPoint(x, y).find(n => n.classList && n.classList.contains('slot') && n.dataset.kind === kind &&
    !(n.querySelector('.item') && n.querySelector('.item').dataset.locked)) || null;
}
addEventListener('pointermove', e => {
  if (press && !drag) {
    if (press.el.dataset.locked || Math.hypot(e.clientX - press.x, e.clientY - press.y) < 6) return;
    startDrag();
  }
  if (!drag) return;
  drag.el.style.left = (e.clientX - drag.dx) + 'px'; drag.el.style.top = (e.clientY - drag.dy) + 'px';
  slots.forEach(s => s.classList.remove('hot'));
  const s = slotUnder(e.clientX, e.clientY, drag.el.dataset.kind); if (s) s.classList.add('hot');
});
addEventListener('pointerup', e => {
  if (press && !drag) { const el = press.el; press = null; openZoom(el); return; }
  press = null;
  if (!drag) return;
  const { el, from } = drag; drag = null;
  el.classList.remove('dragging'); el.removeAttribute('style'); slots.forEach(s => s.classList.remove('hot'));
  const target = slotUnder(e.clientX, e.clientY, el.dataset.kind);
  if (target) {
    const occupant = target.querySelector('.item');
    if (occupant && occupant !== el) {
      if (from.classList && from.classList.contains('slot')) from.appendChild(occupant); else goHome(occupant);
    }
    target.appendChild(el); play('../snd_pickup.mp3');
  } else if (from.classList && from.classList.contains('slot') && !tray.contains(document.elementFromPoint(e.clientX, e.clientY))) {
    from.appendChild(el);
  } else {
    goHome(el);
  }
  refresh(); if (stage === 1) check1(); else if (stage === 2) check2();
});

function rejectPieces(wrong) {
  setTimeout(() => wrong.forEach(w => w.classList.add('shake')), 250);
  setTimeout(() => { wrong.forEach(w => { w.classList.remove('shake'); goHome(w); }); refresh(); }, 800);
}
function lock(list) { list.forEach(el => { el.dataset.locked = '1'; }); }
function say(text) { thought.classList.remove('on'); void thought.offsetWidth; thought.textContent = text; thought.classList.add('on'); }

/* ---------- stage 1 ---------- */
function check1() {
  const ph = S1_COLS.map((_, i) => slotAt('photo', i).querySelector('.item'));
  const nt = S1_COLS.map((_, i) => slotAt('note', i).querySelector('.item'));
  if (ph.some(x => !x) || nt.some(x => !x)) return;
  const wrong = [];
  ph.forEach((p, i) => { if (p.dataset.id !== S1_PHOTOS[i].id) wrong.push(p); });
  nt.forEach((n, i) => { if (n.dataset.id !== ph[i].dataset.id || wrong.includes(ph[i])) wrong.push(n); });
  if (wrong.length) return rejectPieces(wrong);
  solved1(ph, nt);
}
function solved1(ph, nt, instant) {
  stage = 0; lock(ph.concat(nt));
  ph.forEach((p, i) => { link(david, p); if (i) link(ph[i - 1], p); });     // David -> each photo, and photo -> next photo
  play('../snd_pickup.mp3');
  setTimeout(() => say(S1_DONE), instant ? 0 : 900);
  if (instant) startStage2(); else setTimeout(startStage2, 2600);
}

/* ---------- stage 2 ---------- */
function startStage2() {
  stage = 2;
  fillTray([
    ...S2_EVIDENCE.map(e => makePhoto('ev', e.id, e.src, Object.assign({ g: e.g }, e.doc ? { doc: '1' } : {}))),
    ...S2_HYP.map(h => makeNote('hyp', 'h' + h.g, h.text, { g: h.g }, 'hyp')),
  ], 5);
  scene.classList.add('s2on'); requestAnimationFrame(() => requestAnimationFrame(() => scene.classList.add('s2show')));
  window.STAGE = 2;
}
const groupSize = g => S2_EVIDENCE.filter(e => e.g === g).length;
function check2() {
  const all = S2_ZONES.map(z => ({ z, ev: zoneSlots(z.id, 'ev').map(s => s.querySelector('.item')), hyp: zoneSlots(z.id, 'hyp')[0].querySelector('.item') }));
  if (all.some(a => !a.hyp || a.ev.some(x => !x))) return;
  const wrong = []; let ok = 0;
  all.forEach(({ ev, hyp }) => {
    if (ev[0].dataset.locked) { ok++; return; }
    const g = +ev[0].dataset.g;
    const right = ev.every(x => +x.dataset.g === g) && groupSize(g) === ev.length && +hyp.dataset.g === g;
    if (right) { ok++; lock(ev.concat(hyp)); solveZone(ev, hyp); }
    else wrong.push(...ev, hyp);
  });
  if (wrong.length) return rejectPieces(wrong);
  if (ok === S2_ZONES.length) solved2();
}
function solveZone(ev, hyp) {
  ev.forEach((x, i) => { link(x, hyp); if (i) link(ev[i - 1], x); });       // evidence -> hypothesis, evidence -> next evidence
  link(hyp, david);                                                          // hypothesis -> David
  play('../snd_pickup.mp3');
}
function solved2(instant) {
  stage = 3; window.STAGE = 3;
  setTimeout(() => { say(S2_DONE); document.getElementById('evalbtn').classList.add('on'); }, instant ? 0 : 900);
}

/* ---------- the sheet with conclusions ---------- */
const sheetList = document.querySelector('#sheet ol');
STATEMENTS.forEach((t, i) => {
  const li = document.createElement('li'); li.dataset.no = i + 1;
  li.innerHTML = `<span class="cb"><svg viewBox="0 0 24 24"><path d="M3 13 L9.5 20 L22 2"/></svg></span><span class="no">${i + 1}.</span><span class="tx"></span>`;
  li.querySelector('.tx').textContent = t;
  li.addEventListener('click', () => { li.classList.toggle('on'); play('../snd_paper.mp3'); });
  sheetList.appendChild(li);
});
window.ticked = () => [...sheetList.children].filter(li => li.classList.contains('on')).map(li => +li.dataset.no);
document.getElementById('evalbtn').addEventListener('click', () => { document.getElementById('paper').classList.add('on'); play('../snd_paper.mp3'); });

/* ---------- direct entry for testing: ?stage=2 / ?stage=3 ---------- */
const START = +(new URLSearchParams(location.search).get('stage') || 1);
if (START >= 2) {
  const ph = [], nt = [];
  S1_COLS.forEach((_, i) => {
    const p = items.find(x => x.dataset.kind === 'photo' && x.dataset.id === S1_PHOTOS[i].id), n = items.find(x => x.dataset.kind === 'note' && x.dataset.id === S1_PHOTOS[i].id);
    slotAt('photo', i).appendChild(p); slotAt('note', i).appendChild(n); ph.push(p); nt.push(n);
  });
  refresh(); solved1(ph, nt, true);
}
if (START >= 3) {
  S2_ZONES.forEach((z, k) => {
    const g = k + 1, ev = items.filter(x => x.dataset.kind === 'ev' && +x.dataset.g === g), hyp = items.find(x => x.dataset.kind === 'hyp' && +x.dataset.g === g);
    zoneSlots(z.id, 'ev').forEach((s, i) => s.appendChild(ev[i])); zoneSlots(z.id, 'hyp')[0].appendChild(hyp);
    refresh(); lock(ev.concat(hyp)); solveZone(ev, hyp);
  });
  solved2(true); document.getElementById('paper').classList.add('on');
}

document.getElementById('gate').addEventListener('click', function () {
  this.classList.add('off'); startStorm(); setTimeout(lightning, 8000);
});
document.getElementById('mute').addEventListener('click', function () { muted = !muted; storm.volume = muted ? 0 : STORM_VOL; this.textContent = muted ? '🔇' : '🔊'; });
</script>
