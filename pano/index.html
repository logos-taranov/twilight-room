<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David Reed nerede?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --trayw: clamp(190px, 24vw, 360px); --fog:#9fb3ad; }
  html, body { margin:0; height:100%; background:#0b0d0e; overflow:hidden; font-family: Georgia, "Times New Roman", serif; color:#e8efe9; }
  #stage { position:fixed; left:0; top:0; bottom:0; right:var(--trayw); display:flex; align-items:center; justify-content:center; }
  #scene { --sw: min(calc(100vw - var(--trayw)), calc(100vh * 1280 / 853)); position:relative; width:var(--sw); aspect-ratio:1280/853; }
  #scene > img.bg { position:absolute; inset:0; width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; }

  /* centre of the board (Maria 08.10: smaller, leave room for the next stages) */
  .fixed { position:absolute; user-select:none; -webkit-user-drag:none; filter: drop-shadow(2px 5px 7px rgba(0,0,0,.6)); }
  .fixed img { width:100%; display:block; -webkit-user-drag:none; }
  #david { left:41.2%; top:29%; width:8.4%; transform:rotate(-2deg); cursor:zoom-in; }
  #nreed { left:50.6%; top:31.5%; width:9.6%; transform:rotate(-5deg); pointer-events:none; }

  /* drop places for stage 1 (lower part of the board, compact) */
  .slot { position:absolute; border:2px dashed rgba(255,240,215,.26); border-radius:3px; box-sizing:border-box; transition:background .15s, border-color .15s; }
  .slot.photo { top:52%; width:9.6%; height:10.8%; }
  .slot.note  { top:63.6%; width:12%; height:10.6%; background:rgba(246,226,124,.05); }
  .slot.hot   { border-color:rgba(255,236,170,.85); background:rgba(255,236,170,.14); }
  .slot.filled { border-color:transparent; background:none; }

  /* evidence tray (separate compartment) */
  #tray { position:fixed; top:0; right:0; bottom:0; width:var(--trayw); box-sizing:border-box; padding:14px 12px; z-index:5;
          background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,0) 14px), repeating-linear-gradient(92deg, #3b2717 0 7px, #432c1a 7px 15px, #362314 15px 22px);
          box-shadow: inset 0 0 40px rgba(0,0,0,.75); display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3, 1fr); gap:12px; }
  .cell { position:relative; display:flex; align-items:center; justify-content:center; min-height:0; }

  /* evidence pieces */
  .item { position:relative; cursor:grab; touch-action:none; user-select:none; -webkit-user-drag:none; box-sizing:border-box; }
  .cell > .item { width:100%; }
  .slot > .item { width:100%; height:100%; }
  .item.ph img { width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; filter: drop-shadow(2px 4px 6px rgba(0,0,0,.65)); }
  .cell > .item.ph img { height:auto; max-height:28vh; }
  .item.nt { background:#f6e27c; color:#2a2414; font-family:'Caveat', 'Segoe Print', 'Comic Sans MS', cursive; font-weight:700; line-height:1.1;
             padding:6% 7%; box-shadow:2px 4px 8px rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; text-align:center;
             transform:rotate(-1.5deg); overflow:hidden; }
  .cell > .item.nt { font-size:calc(var(--trayw) * 0.043); min-height:9vh; }
  .item.dragging { position:fixed !important; z-index:100; cursor:grabbing; pointer-events:none; transform:rotate(-3deg) scale(1.03); }
  .slot > .item::before, #david::before, #nreed::before { content:""; position:absolute; left:50%; top:-2%; width:calc(var(--sw) * 0.0095); height:calc(var(--sw) * 0.0095);
     transform:translate(-50%, -30%); border-radius:50%; background: radial-gradient(circle at 35% 35%, #ff8a8a, #b5121b 60%, #5a0408); box-shadow:1px 2px 3px rgba(0,0,0,.6); z-index:3; }
  .shake { animation: shake .45s; }
  @keyframes shake { 0%,100%{translate:0} 20%{translate:-6px} 40%{translate:6px} 60%{translate:-4px} 80%{translate:4px} }
  .locked .slot .item { cursor:zoom-in; }

  /* red threads after the stage is solved */
  #threads { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; }
  #threads line { stroke:#b3121c; stroke-width:.3; stroke-linecap:round; stroke-dasharray:60; stroke-dashoffset:60; transition: stroke-dashoffset 1.4s ease; }
  #scene.solved #threads line { stroke-dashoffset:0; }

  /* heroine's comment, like on the other pages */
  #thought { position:absolute; left:50%; bottom:4%; transform:translateX(-50%); max-width:74%; display:none; z-index:8;
             font-size:calc(var(--sw) * 0.0145); font-style:italic; color:#1b1b1b; background:#fff; padding:.7% 1.3%;
             border-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.55); text-align:center; pointer-events:none; }
  #thought.on { display:block; animation: fade 1s ease; }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }

  /* moderate zoom (Maria 08.10: bigger, but not full screen) */
  #zoom { position:fixed; inset:0; z-index:150; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); cursor:zoom-out; }
  #zoom.on { display:flex; }
  #zoom img { max-width:min(46vw, 620px); max-height:58vh; filter: drop-shadow(4px 8px 16px rgba(0,0,0,.7)); animation: zin .18s ease-out; }
  @keyframes zin { from { transform:scale(.85); opacity:.4 } to { transform:none; opacity:1 } }

  #gate { position:fixed; inset:0; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, rgba(32,24,18,.93), rgba(6,5,4,.98)); cursor:pointer; text-align:center; padding:20px; }
  #gate h1 { font-weight:normal; letter-spacing:.12em; font-size: clamp(26px,5vw,48px); margin:0 0 28px; color:#efe4d6; }
  #gate p { color:var(--fog); font-style:italic; margin:0; font-size:15px; opacity:.85; }
  #gate.off { opacity:0; pointer-events:none; transition:opacity 1.2s; }
  #mute { position:fixed; left:16px; bottom:14px; z-index:6; font-size:22px; cursor:pointer; opacity:.7; user-select:none; }
</style>
</head>
<body>
<div id="stage"><div id="scene">
  <img class="bg" src="board.jpg?v=2" alt="">
  <svg id="threads" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  <div class="fixed" id="david"><img src="david.jpg?v=2" alt="David Reed"></div>
  <div class="fixed" id="nreed"><img src="note.png?v=2" alt="DAVİD REED NEREDE?"></div>
  <div id="thought"></div>
</div></div>
<div id="tray"></div>
<div id="zoom"><img alt=""></div>
<div id="mute" title="Ses">🔊</div>
<div id="gate"><h1>David Reed nerede?</h1><p>Girmek için tıklayın 🔊</p></div>
<script>
/* Page 5, stage 1 (Maria 08.10): 3 photos on the lower part of the board, left -> right in story
   order, and the matching sticky note under each. Wrong pieces go back to the tray once all six
   places are filled; the right ones stay. Click a photo = moderate zoom, drag = move. */
const ORDER_MATTERS = true;            // photos left -> right: 1 motel, 2 room, 3 cliff
const PHOTOS = [
  { id:'motel', src:'motel.jpg?v=2' },
  { id:'room',  src:'room.png?v=2' },
  { id:'cliff', src:'cliff.png?v=2' },
];
const NOTES = [
  { id:'motel', text:"David'in son kaldığı yer. Bu Pazartesi saat 08.17'de ayrıldı." },
  { id:'room',  text:"David'in kıyafetleri ve kişisel eşyaları odada kaldı. Görünüşe göre otelden tamamen ayrılmayı planlamıyordu." },
  { id:'cliff', text:"David'in eşyaları, kan izleri ve boğuşma belirtileri burada bulundu." },
];
const STAGE1_DONE = "David'in izini uçurumda kaybettik. Ancak cesedi bulunamadı.";
const COLS = [36, 49.5, 63];           // column centres, % of the scene
const PH_W = 9.6, NT_W = 12;

const scene = document.getElementById('scene'), tray = document.getElementById('tray');
const zoom = document.getElementById('zoom'), zimg = zoom.querySelector('img'), thought = document.getElementById('thought');
let muted = false, locked = false;
function play(name) { if (muted) return; try { new Audio(name).play().catch(() => {}); } catch (e) {} }

/* places on the board */
const slots = [];
COLS.forEach((c, i) => {
  [['photo', PH_W], ['note', NT_W]].forEach(([kind, w]) => {
    const s = document.createElement('div'); s.className = 'slot ' + kind; s.dataset.kind = kind; s.dataset.i = i;
    s.style.left = (c - w / 2) + '%'; scene.appendChild(s); slots.push(s);
  });
});
const slotAt = (kind, i) => slots.find(s => s.dataset.kind === kind && +s.dataset.i === i);

/* tray: photos and notes shuffled */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const items = [];
PHOTOS.forEach(p => { const el = document.createElement('div'); el.className = 'item ph'; el.dataset.kind = 'photo'; el.dataset.id = p.id;
  el.innerHTML = `<img src="${p.src}" alt="">`; items.push(el); });
NOTES.forEach(n => { const el = document.createElement('div'); el.className = 'item nt'; el.dataset.kind = 'note'; el.dataset.id = n.id;
  el.textContent = n.text; items.push(el); });
shuffle(items.slice()).forEach(el => { const c = document.createElement('div'); c.className = 'cell'; tray.appendChild(c); c.appendChild(el); el.home = c; });

/* sticky-note text always fits its place on the board */
function fit(el) {
  if (!el.classList.contains('nt')) return;
  if (!el.parentElement.classList.contains('slot')) { el.style.fontSize = ''; return; }
  const sw = scene.getBoundingClientRect().width; let fs = sw * 0.0118; el.style.fontSize = fs + 'px';
  while (fs > 6 && el.scrollHeight > el.clientHeight + 1) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
}
function refresh() { slots.forEach(s => s.classList.toggle('filled', !!s.querySelector('.item'))); items.forEach(fit); }
addEventListener('resize', refresh);
function goHome(el) { el.home.appendChild(el); }

/* zoom */
function openZoom(src) { zimg.src = src; zoom.classList.add('on'); }
zoom.addEventListener('click', () => zoom.classList.remove('on'));
addEventListener('keydown', e => { if (e.key === 'Escape') zoom.classList.remove('on'); });
document.getElementById('david').addEventListener('click', () => openZoom('david.jpg?v=2'));

/* drag & drop; a press without movement on a photo = zoom */
let press = null, drag = null;
items.forEach(el => el.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  e.preventDefault();
  press = { el, x: e.clientX, y: e.clientY };
}));
function startDrag(e) {
  const el = press.el, r = el.getBoundingClientRect();
  drag = { el, from: el.parentElement, dx: press.x - r.left, dy: press.y - r.top };
  Object.assign(el.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  document.body.appendChild(el); el.classList.add('dragging'); refresh();
  play(el.dataset.kind === 'note' ? '../snd_paper.mp3' : '../snd_pickup.mp3');
}
function slotUnder(x, y, kind) {
  return document.elementsFromPoint(x, y).find(n => n.classList && n.classList.contains('slot') && n.dataset.kind === kind) || null;
}
addEventListener('pointermove', e => {
  if (press && !drag) {
    if (locked || Math.hypot(e.clientX - press.x, e.clientY - press.y) < 6) return;
    startDrag(e);
  }
  if (!drag) return;
  drag.el.style.left = (e.clientX - drag.dx) + 'px'; drag.el.style.top = (e.clientY - drag.dy) + 'px';
  slots.forEach(s => s.classList.remove('hot'));
  const s = slotUnder(e.clientX, e.clientY, drag.el.dataset.kind); if (s) s.classList.add('hot');
});
addEventListener('pointerup', e => {
  if (press && !drag) {                       // a click, not a drag
    const el = press.el; press = null;
    if (el.classList.contains('ph')) openZoom(el.querySelector('img').src);
    return;
  }
  press = null;
  if (!drag) return;
  const { el, from } = drag; drag = null;
  el.classList.remove('dragging'); el.removeAttribute('style'); slots.forEach(s => s.classList.remove('hot'));
  const target = slotUnder(e.clientX, e.clientY, el.dataset.kind);
  if (target) {
    const occupant = target.querySelector('.item');
    if (occupant && occupant !== el) {
      if (from.classList && from.classList.contains('slot')) from.appendChild(occupant); else goHome(occupant);
    }
    target.appendChild(el); play('../snd_pickup.mp3');
  } else if (from.classList && from.classList.contains('slot') && !tray.contains(document.elementFromPoint(e.clientX, e.clientY))) {
    from.appendChild(el);
  } else {
    goHome(el);
  }
  refresh(); check();
});

/* stage check: only when all six places are filled */
function check() {
  const ph = COLS.map((_, i) => slotAt('photo', i).querySelector('.item'));
  const nt = COLS.map((_, i) => slotAt('note', i).querySelector('.item'));
  if (ph.some(x => !x) || nt.some(x => !x)) return;
  const wrong = [];
  ph.forEach((p, i) => { if (ORDER_MATTERS && p.dataset.id !== PHOTOS[i].id) wrong.push(p); });
  nt.forEach((n, i) => { if (n.dataset.id !== ph[i].dataset.id || wrong.includes(ph[i])) wrong.push(n); });
  if (!wrong.length) return solved();
  setTimeout(() => wrong.forEach(w => w.classList.add('shake')), 250);
  setTimeout(() => { wrong.forEach(w => { w.classList.remove('shake'); goHome(w); }); refresh(); }, 800);
}
function solved() {
  locked = true; scene.classList.add('locked');
  document.getElementById('threads').innerHTML = COLS.map(c => `<line x1="45.4" y1="45.6" x2="${c}" y2="52.3"/>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => scene.classList.add('solved')));
  setTimeout(() => { thought.textContent = STAGE1_DONE; thought.classList.add('on'); }, 900);
  play('../snd_pickup.mp3');
  window.STAGE = 2;                            // next stage: waiting for Maria's description
}

document.getElementById('gate').addEventListener('click', function () { this.classList.add('off'); });
document.getElementById('mute').addEventListener('click', function () { muted = !muted; this.textContent = muted ? '🔇' : '🔊'; });
</script>
</body>
</html>
