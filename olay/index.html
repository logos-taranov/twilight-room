<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olay yerinde</title>
<style>
  :root { --glow:rgba(190,220,210,.55); --fog:#9fb3b0; --invw:128px; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0b1110; color:#e8efe9; font-family: Georgia, "Times New Roman", serif; overflow:hidden; }
  #stage { position:fixed; inset:0 var(--invw) 0 0; display:flex; align-items:center; justify-content:center; }
  #scene { position:relative; width:min(calc(100vw - var(--invw)), calc(100vh * var(--ar))); aspect-ratio: var(--ar); }
  #scene > .bg { position:absolute; inset:0; width:100%; height:100%; display:block; filter:saturate(.9) brightness(.97); user-select:none; -webkit-user-drag:none; }
  .hot { position:absolute; cursor:zoom-in; border-radius:10px; transition: box-shadow .35s, background .35s; }
  .hot.nozoom { cursor:crosshair; }
  .hot:hover { box-shadow: 0 0 22px 6px var(--glow) inset, 0 0 18px 2px var(--glow); background: rgba(200,230,220,.06); }
  body.edit .hot { outline:1px dashed #ffd27a; }
  #note { position:absolute; left:50%; bottom:3.5%; transform:translateX(-50%); z-index:4; max-width:84%; text-align:center;
    background:#fff; color:#1b1b1b; padding:12px 20px; border-radius:4px; font-size:16px; font-style:italic; line-height:1.4;
    box-shadow:0 8px 28px rgba(0,0,0,.6); pointer-events:none; opacity:0; transition:opacity 1s; }
  #note.on { opacity:1; }
  #inv { position:fixed; top:0; right:0; bottom:0; width:var(--invw); z-index:6; display:flex; flex-direction:column; justify-content:center;
    gap:12px; padding:12px; background:linear-gradient(90deg,rgba(10,16,15,.0),rgba(10,16,15,.85) 30%); border-left:1px solid rgba(160,190,180,.18); }
  #inv .slot { width:100%; aspect-ratio:3/2; border:1px dashed rgba(170,200,190,.28); border-radius:6px; display:flex; align-items:center;
    justify-content:center; overflow:hidden; background:rgba(255,255,255,.03); }
  #inv .slot img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; animation:pop .5s ease; }
  @keyframes pop { from { transform:scale(.4); opacity:0 } to { transform:scale(1); opacity:1 } }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:30; }
  #flash.on { animation: flash .45s ease-out; }
  @keyframes flash { 0% { opacity:.9 } 100% { opacity:0 } }
  #modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:10; background:rgba(4,8,8,.88); backdrop-filter: blur(3px); }
  #modal.on { display:flex; animation: fade .35s ease; }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  #modal figure { margin:0; max-width:92vw; max-height:92vh; text-align:center; }
  #mimg { max-width:88vw; max-height:76vh; border-radius:6px; box-shadow:0 10px 50px rgba(0,0,0,.8); }
  #modal figcaption { margin:14px auto 0; max-width:720px; font-size:17px; font-style:italic; color:#1b1b1b; background:#fff; padding:10px 16px; border-radius:4px; display:inline-block; }
  #modal figcaption:empty { display:none; }
  #close { position:fixed; top:14px; right:calc(var(--invw) + 18px); font-size:34px; color:#cfdcd7; cursor:pointer; z-index:11; display:none; user-select:none; }
  #modal.on ~ #close { display:block; }
  #gate { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, rgba(20,32,30,.92), rgba(4,8,8,.98)); cursor:pointer; text-align:center; padding:20px; }
  #gate h1 { font-weight:normal; letter-spacing:.12em; font-size: clamp(26px,5vw,48px); margin:0 0 28px; color:#dfe9e4; }
  #gate p { color:var(--fog); font-style:italic; margin:0; font-size:15px; opacity:.85; }
  #gate.off { opacity:0; pointer-events:none; transition:opacity 1.2s; }
  #mute { position:fixed; left:16px; bottom:14px; z-index:6; font-size:22px; cursor:pointer; opacity:.7; user-select:none; }
</style>
</head>
<body>
<div id="stage"><div id="scene"><div id="note"></div></div></div>
<div id="inv"></div>
<div id="flash"></div>
<div id="modal"><figure><img id="mimg" alt=""><br><figcaption id="mcap"></figcaption></figure></div>
<div id="close" title="Kapat">×</div>
<div id="mute" title="Ses">🔊</div>
<div id="gate"><h1>Olay yerinde</h1><p>Girmek için tıklayın 🔊</p></div>

<script>
/* Точки — проценты от картинки (x,y = левый верхний угол, w,h = размер). ?edit=1 показывает рамки.
   Левая кнопка = рассмотреть (close + caption), правая = сфотографировать (photo в инвентарь). */
const SCENE = {
  image:"main.jpg", aspect:1280/853,
  hint:"Bir nesneyi incelemek için sol fare tuşunu, fotoğrafını çekmek için sağ fare tuşunu kullanın.",
  final:"Sanırım bu kadar.",
  hotspots:[
    { id:"camera",  x:44, y:44.5, w:16, h:14, close:"camera_close.jpg",  caption:"Kamera ve objektif kırık, hafıza kartını göremiyorum.", photo:"photo_camera.jpg" },
    { id:"pendant", x:8,  y:63,   w:9,  h:14, close:"pendant_close.jpg", caption:"Bu da ne böyle?", photo:"photo_pendant.jpg" },
    { id:"blood",   x:63, y:46.5, w:18, h:12, close:"blood_close.jpg",   caption:"Bu David'in kanı mı yoksa?", photo:"photo_blood.jpg" },
    { id:"cliff",   x:74, y:27,   w:22, h:19, close:"cliff_close.jpg",   caption:"Yükseklik korkum var. En iyisi kenardan uzak durmak.", photo:"photo_cliff.jpg" },
    { id:"sunset",  x:83, y:8,    w:17, h:18, close:null, caption:"", photo:"photo_sunset.jpg" }
  ]
};
const EDIT = new URLSearchParams(location.search).has('edit');
if(EDIT) document.body.classList.add('edit');

/* ---------- звук: щелчок затвора (синтез) ---------- */
let ctx, master, muted=false;
function audio(){ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.connect(ctx.destination);} return ctx; }
function burst(t, dur, freq, q, vol){
  const c=audio(), n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
  const g=c.createGain(); g.gain.value=vol; s.connect(f).connect(g).connect(master); s.start(t);
}
function shutter(){ if(muted) return; const t=audio().currentTime; burst(t,.035,3200,1.2,1.4); burst(t+.07,.05,1800,1.0,1.1); burst(t+.075,.02,5200,2,.6); }

/* ---------- состояние ---------- */
const hovered=new Set(), inspected=new Set(), shot=[];
const needInspect=SCENE.hotspots.filter(h=>h.close).map(h=>h.id);
function progress(){
  const done = SCENE.hotspots.every(h=>hovered.has(h.id)) && needInspect.every(id=>inspected.has(id)) && shot.length===SCENE.hotspots.length;
  const n=document.getElementById('note'); n.textContent = done ? SCENE.final : SCENE.hint; return done;
}

/* ---------- сцена ---------- */
const scene=document.getElementById('scene'), modal=document.getElementById('modal'), mimg=document.getElementById('mimg'), mcap=document.getElementById('mcap'), inv=document.getElementById('inv');
scene.style.setProperty('--ar', SCENE.aspect);
const bg=new Image(); bg.className='bg'; bg.src=SCENE.image; bg.alt='Olay yerinde'; scene.prepend(bg);
for(let i=0;i<SCENE.hotspots.length;i++){ const s=document.createElement('div'); s.className='slot'; inv.appendChild(s); }
let current=null;
function openImage(src, caption, hot){ current=hot||null; mimg.src=src; mcap.textContent=caption||''; modal.classList.add('on'); }
function closeModal(){ modal.classList.remove('on'); current=null; progress(); }
function takePhoto(h){
  if(shot.includes(h.id)) return;
  shutter(); const fl=document.getElementById('flash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
  shot.push(h.id);
  const slot=inv.children[shot.length-1]; const im=new Image(); im.src=h.photo; im.alt=h.id; im.dataset.id=h.id;
  im.addEventListener('click',()=>openImage(h.photo,'',null)); slot.appendChild(im);
  progress();
}
SCENE.hotspots.forEach(h=>{
  const el=document.createElement('div'); el.className='hot'+(h.close?'':' nozoom'); el.dataset.id=h.id;
  Object.assign(el.style,{left:h.x+'%',top:h.y+'%',width:h.w+'%',height:h.h+'%'});
  el.addEventListener('mouseenter',()=>{ if(EDIT) return; hovered.add(h.id); });
  el.addEventListener('mouseleave',()=>progress());
  el.addEventListener('click',e=>{ e.stopPropagation(); if(!h.close) return; inspected.add(h.id); openImage(h.close,h.caption,h); });
  el.addEventListener('contextmenu',e=>{ e.preventDefault(); e.stopPropagation(); hovered.add(h.id); takePhoto(h); });
  scene.appendChild(el);
});
/* в крупном плане правая кнопка тоже фотографирует этот предмет */
modal.addEventListener('contextmenu',e=>{ e.preventDefault(); if(current) takePhoto(current); });
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
document.getElementById('close').addEventListener('click',closeModal);
addEventListener('keydown',e=>{ if(e.key==='Escape' && modal.classList.contains('on')) closeModal(); });
addEventListener('contextmenu',e=>e.preventDefault());
SCENE.hotspots.forEach(h=>{ [h.close,h.photo].forEach(u=>{ if(u){ const p=new Image(); p.src=u; } }); });
document.getElementById('gate').addEventListener('click',function(){
  audio().resume(); this.classList.add('off'); progress();
  setTimeout(()=>document.getElementById('note').classList.add('on'), 900);
});
document.getElementById('mute').addEventListener('click',function(){ muted=!muted; if(master) master.gain.value=muted?0:1; this.textContent=muted?'🔇':'🔊'; });
</script>
</body>
</html>
