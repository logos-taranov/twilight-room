<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dizüstü bilgisayar</title>
<style>
  html, body { margin:0; height:100%; background:#050607; overflow:hidden; font-family: Tahoma, Verdana, "Segoe UI", sans-serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #scene { --sw: min(100vw, calc(100vh * 1280 / 853)); position:relative; width:var(--sw); aspect-ratio:1280/853; }
  #scene img.bg { position:absolute; inset:0; width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; }
  #desk { opacity:0; transition:opacity .6s ease; pointer-events:none; }
  #scene.unlocked #desk { opacity:1; }
  /* XP arrow (white fill, black outline) everywhere on the laptop */
  #scene, #scene *, #viewer, #viewer * { cursor:url('cursor.png') 0 0, default !important; }
  #screen { position:absolute; left:16.5%; top:11.8%; width:70.1%; height:65.3%; }
  #pw { position:absolute; left:52.7%; top:51.95%; width:24.3%; height:3.1%; box-sizing:border-box; border:0; outline:none;
        background:transparent; color:#000; font: 600 calc(var(--sw) * 0.0125) Tahoma, Verdana, sans-serif;
        padding:0 .5%; letter-spacing:.12em; caret-color:#000; }
  #go { position:absolute; left:77.4%; top:51.6%; width:3.0%; height:3.8%; }
  #err { position:absolute; left:52.7%; top:56.6%; max-width:27%; display:none; background:#ffffe1; color:#000;
         border:1px solid #000; border-radius:6px; padding:.45% .7%; box-shadow:2px 2px 4px rgba(0,0,0,.45);
         font-size:calc(var(--sw) * 0.0105); line-height:1.35; }
  #err b { display:block; margin-bottom:.15em; }
  #err:before { content:""; position:absolute; left:14px; top:-9px; border:9px solid transparent; border-top:0; border-bottom-color:#000; }
  #err:after  { content:""; position:absolute; left:15px; top:-7px; border:8px solid transparent; border-top:0; border-bottom-color:#ffffe1; }
  #scene.unlocked #pw, #scene.unlocked #go, #scene.unlocked #err { display:none; }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  /* desktop icons: only after unlock */
  #icons { display:none; }
  #scene.unlocked #icons { display:block; }
  .ico { position:absolute; border-radius:3px; }
  .ico.sel { background:rgba(49,106,197,.42); outline:1px dotted rgba(255,255,255,.9); }
  /* SCANS window (her screenshot), double-click sarah.jpg inside */
  #win { position:absolute; left:33%; top:17%; width:34.9%; aspect-ratio:447/375; display:none; box-shadow:4px 6px 18px rgba(0,0,0,.55); }
  #win.open { display:block; animation: winpop .18s ease-out; }
  @keyframes winpop { from { transform:scale(.92); opacity:.4 } to { transform:none; opacity:1 } }
  #win img { width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; }
  #winclose, .wclose { position:absolute; left:92.4%; top:2%; width:6%; height:7.6%; }
  #vwin { position:absolute; left:30.2%; top:16.9%; width:44.1%; aspect-ratio:564/458; display:none; box-shadow:4px 6px 18px rgba(0,0,0,.55); }
  #owin { position:absolute; left:25.7%; top:16.65%; width:52.66%; aspect-ratio:674/499; display:none; box-shadow:4px 6px 18px rgba(0,0,0,.55); }
  #owin.open { display:block; animation: winpop .18s ease-out; }
  #owin img { width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; }
  #owin .wclose { left:95.2%; top:0.8%; width:3.6%; height:4.4%; }
  #vwin.open { display:block; animation: winpop .18s ease-out; }
  #vwin img { width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; }
  #vwin .wclose { left:94.4%; top:1.2%; width:3.4%; height:6.8%; }
  .vfile { position:absolute; top:28.5%; width:9.6%; height:16.5%; border-radius:2px; }
  .vfile.sel { background:rgba(49,106,197,.30); outline:1px dotted #000; }
  #file { position:absolute; left:38.4%; top:30%; width:12.4%; height:16.4%; border-radius:2px; }
  #file.sel { background:rgba(49,106,197,.30); outline:1px dotted #000; }
  /* character thought, like on the other pages */
  #thought { position:absolute; left:50%; bottom:3.2%; transform:translateX(-50%); max-width:70%; display:none;
             font-size:calc(var(--sw) * 0.0145); font-style:italic; color:#1b1b1b; background:#fff; padding:.7% 1.3%;
             border-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.5); text-align:center; z-index:50; pointer-events:none; }
  /* article viewer */
  #viewer { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.82); z-index:20; }
  #viewer.open { display:flex; }
  #vbox { position:relative; line-height:0; }
  #viewer img { max-width:92vw; max-height:84vh; box-shadow:0 8px 30px rgba(0,0,0,.7); display:block; }
  #vsym { position:absolute; left:79%; top:29%; width:13%; height:26%; display:none; border-radius:6px; }
  #vcap { position:fixed; left:50%; bottom:46px; transform:translateX(-50%); max-width:80vw; display:none; z-index:22;
          font: italic 19px Georgia, 'Times New Roman', serif; color:#1b1b1b; background:#fff; padding:9px 16px; border-radius:4px;
          box-shadow:0 2px 12px rgba(0,0,0,.6); text-align:center; pointer-events:none; line-height:1.35; }
  .nav { position:fixed; top:50%; transform:translateY(-50%); font-size:54px; color:#e8e8e8; padding:10px 18px; user-select:none; z-index:21; display:none; text-shadow:0 2px 8px #000; }
  #viewer.gallery .nav { display:block; }
  #prev { left:8px; } #next { right:8px; }
  #counter { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); color:#ddd; font-size:15px; display:none; z-index:21; }
  #viewer.gallery #counter { display:block; }
  #vclose { position:fixed; top:12px; right:20px; font-size:36px; color:#e8e8e8; user-select:none; z-index:21; }
  #mute { position:fixed; left:16px; bottom:14px; z-index:30; font-size:22px; opacity:.7; user-select:none; cursor:pointer; }
</style>
</head>
<body>
<div id="stage"><div id="scene">
  <img class="bg" id="login" src="login.jpg" alt="">
  <img class="bg" id="desk" src="desktop.jpg" alt="">
  <div id="screen"></div>
  <div id="icons"></div>
  <input id="pw" type="password" autocomplete="off" spellcheck="false" aria-label="password">
  <div id="go"></div>
  <div id="err"><b>Incorrect password</b>The password you typed is incorrect. Please try again.</div>
  <div id="win"><img src="scans.jpg" alt=""><div id="winclose"></div><div id="file"></div></div>
  <div id="vwin"><img src="volterra.jpg" alt=""><div class="wclose"></div></div>
  <div id="owin"><img src="outlook.jpg" alt=""><div class="wclose"></div></div>
  <div id="thought"></div>
</div></div>
<div id="viewer"><div id="vbox"><img id="vimg" src="sarah.jpg" alt=""><div id="vsym"></div></div><div id="vcap"></div><div id="vclose">✕</div><div class="nav" id="prev">‹</div><div class="nav" id="next">›</div><div id="counter"></div></div>
<div id="mute" title="Ses">🔊</div>
<script>
const PASSWORD = 'glacier1986';            // case does not matter: Glacier1986 / GLACIER1986 / glacier1986
const scene = document.getElementById('scene'), pw = document.getElementById('pw'), err = document.getElementById('err');
const thought = document.getElementById('thought'), win = document.getElementById('win'), viewer = document.getElementById('viewer');

/* ---------- police-station ambience (her video), starts on the first key/click ---------- */
const AMB_VOL = .275;   // Maria 05.10: 2x quieter than .55
const amb = new Audio('police.mp3'); amb.loop = true; amb.volume = 0; let muted = false, started = false;
function startAmb() {
  if (started) return; started = true;
  amb.play().then(() => { let v = 0; const t = setInterval(() => { v = Math.min(AMB_VOL, v + .03); amb.volume = muted ? 0 : v; if (v >= AMB_VOL) clearInterval(t); }, 120); }).catch(() => { started = false; });
}
['keydown', 'mousedown'].forEach(ev => document.addEventListener(ev, startAmb, true));
document.getElementById('mute').addEventListener('click', function () { muted = !muted; amb.volume = muted ? 0 : AMB_VOL; this.textContent = muted ? '🔇' : '🔊'; });

/* ---------- login ---------- */
function tryUnlock() {
  if (scene.classList.contains('unlocked')) return;
  if (pw.value.trim().toLowerCase() === PASSWORD) {
    err.style.display = 'none'; scene.classList.add('unlocked'); pw.blur();
  } else {
    err.style.display = 'block';
    pw.classList.remove('shake'); void pw.offsetWidth; pw.classList.add('shake'); pw.select();
  }
}
pw.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); else if (err.style.display === 'block' && e.key.length === 1) err.style.display = 'none'; });
document.getElementById('go').addEventListener('click', tryUnlock);
scene.addEventListener('mousedown', e => { if (!scene.classList.contains('unlocked') && e.target !== pw) setTimeout(() => pw.focus(), 0); });

/* ---------- thoughts ---------- */
let pinned = null;   // a short-lived thought (after double-click) wins over hover
function say(text) { if (pinned) return; thought.textContent = text || ''; thought.style.display = text ? 'block' : 'none'; }
function pin(text, ms) { clearTimeout(pinned); pinned = null; say(text); pinned = setTimeout(() => { pinned = null; say(hoverText); }, ms); }
let hoverText = '';

/* ---------- desktop icons (% of the whole picture) ---------- */
const LEFT_HOVER = 'Şimdilik görevime odaklanmam lazım', LEFT_DBL = 'Bunlara vaktim yok';
const ICONS = [
  // left side: thought on hover, refusal on double-click
  { n:'My Computer',        x:17.5, y:12.5, w:6.5, h:7.0, hover:LEFT_HOVER, dbl:LEFT_DBL },
  { n:'Recycle Bin',        x:17.5, y:20.5, w:6.5, h:7.5, hover:LEFT_HOVER, dbl:LEFT_DBL },
  { n:'Internet Explorer',  x:17.5, y:29.0, w:5.8, h:9.5, hover:LEFT_HOVER, dbl:LEFT_DBL },
  { n:'Windows Media',      x:24.5, y:35.0, w:6.0, h:9.0, hover:LEFT_HOVER, dbl:LEFT_DBL },
  { n:'Adobe Reader',       x:16.5, y:43.0, w:7.0, h:9.0, hover:LEFT_HOVER, dbl:LEFT_DBL },
  { n:'Nero StartSmart',    x:23.5, y:44.5, w:7.5, h:7.5, hover:LEFT_HOVER, dbl:LEFT_DBL },
  { n:'Kodak EasyShare',    x:16.0, y:53.5, w:8.0, h:7.5, hover:LEFT_HOVER, dbl:LEFT_DBL },
  { n:'QuickTime Player',   x:24.5, y:53.5, w:5.5, h:9.5, hover:LEFT_HOVER, dbl:LEFT_DBL },
  { n:'Spider Solitaire',   x:16.5, y:64.0, w:7.0, h:8.0, hover:LEFT_HOVER, dbl:LEFT_DBL },
  // right side
  { n:'VOLTERRA',           x:79.0, y:13.0, w:6.0, h:7.5, open:'volterra' },
  { n:'SCANS',              x:79.0, y:21.5, w:6.0, h:7.0, open:'scans' },
  { n:'Outlook Express',    x:78.5, y:30.0, w:8.0, h:7.5, hover:'Bakalım kiminle yazışmış...', open:'outlook' },
  { n:'The Black Mirror I', x:78.0, y:39.5, w:9.5, h:8.0, hover:'Adam amma zevkliymiş! Bu oyun bir efsane' },
];
const icons = document.getElementById('icons');
function clearSel() { document.querySelectorAll('.sel').forEach(x => x.classList.remove('sel')); }
for (const it of ICONS) {
  const d = document.createElement('div'); d.className = 'ico'; d.dataset.n = it.n;
  Object.assign(d.style, { left: it.x + '%', top: it.y + '%', width: it.w + '%', height: it.h + '%' });
  d.addEventListener('mouseenter', () => { hoverText = it.hover || ''; say(hoverText); });
  d.addEventListener('mouseleave', () => { hoverText = ''; say(''); });
  d.addEventListener('mousedown', e => { e.stopPropagation(); clearSel(); d.classList.add('sel'); });
  d.addEventListener('dblclick', () => {
    if (it.dbl) pin(it.dbl, 2600);
    if (it.open === 'scans') { front(win); clearSel(); }
    if (it.open === 'volterra') { front(vwin); clearSel(); }
    if (it.open === 'outlook') { front(owin); clearSel(); }
  });
  icons.appendChild(d);
}
document.getElementById('screen').addEventListener('mousedown', clearSel);

/* ---------- SCANS window + article ---------- */
const file = document.getElementById('file');
document.getElementById('winclose').addEventListener('click', e => { e.stopPropagation(); win.classList.remove('open'); });
win.addEventListener('mousedown', e => { e.stopPropagation(); if (e.target !== file) file.classList.remove('sel'); });
file.addEventListener('mousedown', e => { e.stopPropagation(); file.classList.add('sel'); });
file.addEventListener('dblclick', () => openViewer(['sarah.jpg'], 0));
const vimg = document.getElementById('vimg'), counter = document.getElementById('counter');
let gal = [], gi = 0;
const vcap = document.getElementById('vcap'), vsym = document.getElementById('vsym');
let caps = [], symAt = -1, symHover = false;
function cap(t) { vcap.textContent = t || ''; vcap.style.display = t ? 'block' : 'none'; }
function showGal() {
  vimg.src = gal[gi]; counter.textContent = (gi + 1) + ' / ' + gal.length;
  vsym.style.display = gi === symAt ? 'block' : 'none'; symHover = false; cap(caps[gi]);
}
function openViewer(list, i, captions, symbolIndex) {
  gal = list; gi = i; caps = captions || []; symAt = symbolIndex === undefined ? -1 : symbolIndex;
  showGal(); viewer.classList.toggle('gallery', list.length > 1); viewer.classList.add('open');
}
vsym.addEventListener('mouseenter', () => { symHover = true; cap('Bu sembolü daha önce görmüştüm!'); });
vsym.addEventListener('mouseleave', () => { symHover = false; cap(caps[gi]); });
vsym.addEventListener('click', e => { e.stopPropagation(); });
function step(d) { if (gal.length < 2) return; gi = (gi + d + gal.length) % gal.length; showGal(); }
document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); step(-1); });
document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); step(1); });
vimg.addEventListener('click', e => { e.stopPropagation(); step(1); });
function closeViewer() { viewer.classList.remove('open'); cap(''); }
document.getElementById('vclose').addEventListener('click', closeViewer);
viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
document.addEventListener('keydown', e => {
  if (viewer.classList.contains('open') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { step(e.key === 'ArrowRight' ? 1 : -1); return; }
  if (e.key !== 'Escape') return;
  if (viewer.classList.contains('open')) { closeViewer(); return; }
  const top = [win, vwin, owin].filter(w => w.classList.contains('open')).sort((a, b) => (+b.style.zIndex || 0) - (+a.style.zIndex || 0))[0];
  if (top) top.classList.remove('open');
});
/* VOLTERRA folder: files 1..5 (her order); double-click opens the photo, arrows/click go to the next one */
const vwin = document.getElementById('vwin'), owin = document.getElementById('owin');
const VOL = ['v1.jpg','v2.jpg','v3.jpg','v4.jpg','v5.jpg'];   // Maria 05.10 14:44: corrected order
const VOL_CAPS = ['Burası İtalya mı?', 'Burası İtalya mı?', 'Burası İtalya mı?', 'Bu da ne?', 'Bir dakika, bu çok tuhaf...'];
let zTop = 10; function front(w) { w.classList.add('open'); w.style.zIndex = ++zTop; }
[win, vwin, owin].forEach(w => w.addEventListener('mousedown', () => { w.style.zIndex = ++zTop; }, true));
owin.querySelector('.wclose').addEventListener('click', e => { e.stopPropagation(); owin.classList.remove('open'); });
owin.addEventListener('mousedown', e => e.stopPropagation());
vwin.querySelector('.wclose').addEventListener('click', e => { e.stopPropagation(); vwin.classList.remove('open'); });
vwin.addEventListener('mousedown', e => { e.stopPropagation(); if (!e.target.classList.contains('vfile')) vwin.querySelectorAll('.vfile').forEach(f => f.classList.remove('sel')); });
VOL.forEach((src, i) => {
  const f = document.createElement('div'); f.className = 'vfile'; f.dataset.i = i + 1;
  f.style.left = (35.8 + i * 12.55) + '%';
  f.addEventListener('mousedown', e => { e.stopPropagation(); vwin.querySelectorAll('.vfile').forEach(x => x.classList.remove('sel')); f.classList.add('sel'); });
  f.addEventListener('dblclick', () => openViewer(VOL, i, VOL_CAPS, 4));
  vwin.appendChild(f);
});

window.addEventListener('load', () => pw.focus());
</script>
</body>
</html>
