<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сумерки · Комната</title>
<style>
  :root { --fog:#9fb3b0; --ink:#e8efe9; --glow:rgba(190,220,210,.55); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0b1110; color:var(--ink);
    font-family: Georgia, "Times New Roman", serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #scene { position:relative; width:min(100vw, calc(100vh * var(--ar))); aspect-ratio: var(--ar); }
  #scene > .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
    filter: saturate(.8) brightness(.92); user-select:none; -webkit-user-drag:none; }
  .hot { position:absolute; cursor:pointer; border-radius:10px; transition: box-shadow .35s, background .35s; }
  .hot:hover, .hot.focus { box-shadow: 0 0 22px 6px var(--glow) inset, 0 0 18px 2px var(--glow);
    background: rgba(200,230,220,.06); }
  body.edit .hot { outline: 1px dashed #ffd27a; }
  #tip { z-index:15 !important; position:fixed; pointer-events:none; max-width:340px; padding:12px 16px; font-size:16px; line-height:1.45;
    background:#ffffff; color:#1b1b1b; border-radius:4px;
    box-shadow:0 8px 28px rgba(0,0,0,.55); opacity:0; transition:opacity .25s; font-style:italic; z-index:5; }
  #tip.on { opacity:1; }
  #modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:10;
    background: rgba(4,8,8,.86); backdrop-filter: blur(3px); }
  #modal.on { display:flex; animation: fade .35s ease; }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  #modal figure { margin:0; max-width:92vw; max-height:92vh; text-align:center; }
  #mframe { position:relative; display:inline-block; line-height:0; }
  #mframe .hot { z-index:2; }
  #modal img { max-width:92vw; max-height:78vh; border-radius:6px; box-shadow:0 10px 50px rgba(0,0,0,.8);
    filter:saturate(.85); }
  #modal figcaption { margin-top:14px; font-size:17px; font-style:italic; color:#cfdcd7; }
  #close { position:fixed; top:14px; right:18px; font-size:30px; color:#cfdcd7; cursor:pointer; z-index:11; display:none; }
  #modal.on ~ #close { display:block; }
  body.locked #close { display:none !important; }
  #gate { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, rgba(20,32,30,.92), rgba(4,8,8,.98)); cursor:pointer; text-align:center; padding:20px; }
  #gate h1 { font-weight:normal; letter-spacing:.12em; font-size: clamp(26px,5vw,48px); margin:0 0 12px; color:#dfe9e4; }
  #gate h2 { font-weight:normal; font-style:italic; font-size: clamp(18px,3vw,28px); margin:0 0 28px; color:#b9cbc5; letter-spacing:.06em; }
  #gate p { color:var(--fog); font-style:italic; margin:0; font-size:15px; opacity:.85; }
  #gate.off { opacity:0; pointer-events:none; transition:opacity 1.2s; }
  #mute { position:fixed; left:16px; bottom:14px; z-index:6; font-size:22px; cursor:pointer; opacity:.7; user-select:none; }
  #editbox { position:fixed; right:10px; bottom:10px; width:360px; max-height:45vh; z-index:7; display:none;
    background:#111a18; color:#ffd27a; font:12px/1.4 monospace; border:1px solid #ffd27a55; padding:8px; white-space:pre; overflow:auto; }
  body.edit #editbox { display:block; }
  .draw { position:absolute; border:2px solid #ffd27a; background:rgba(255,210,122,.12); pointer-events:none; }
</style>
</head>
<body>
<div id="stage"><div id="scene"></div></div>
<div id="tip"></div>
<div id="modal"><figure><div id="mframe"><img id="mimg" alt=""></div><figcaption id="mcap"></figcaption></figure></div>
<div id="close">×</div>
<div id="mute" title="Звук">🔊</div>
<div id="gate"><h1 id="gtitle">Sedar Creek Motel</h1><h2 id="gsub">Avcının odası</h2><p>Girmek için tıklayın 🔊</p></div>
<pre id="editbox"></pre>

<script>
/* ============ НАСТРОЙКА СЦЕНЫ ============
   Координаты точек в процентах от картинки: x,y = левый верхний угол, w,h = размер.
   Чтобы разметить новую картинку, откройте страницу с ?edit=1 и обведите места мышью.
   sound: "rustle" | "drawer" | "paper" | "wood" | "glass" | ссылка на свой файл (mp3/ogg)
*/
const SCENE = {
  title: "Sedar Creek Motel",
  subtitle: "Avcının odası",
  image: "room.jpg",
  aspect: 1280/853,
  rain: "rain.mp3",            // свой файл дождя (из видео Марии); "rain" = синтезированный
  hotspots: [
    { id:"painting", x:9, y:0.5, w:19, h:16,
      text:"Ne tuhaf bir resim… Bir bale stüdyosuna benziyor.",
      image:"painting.jpg", caption:"", sound:"" },
    { id:"tv", x:95.5, y:13.5, w:4.5, h:21,
      text:"Televizyonun etrafına da bir bakayım.", image:"tv.jpg",
      caption:"Televizyonu yeni oynatmışlar galiba. Bir bakayım…", sound:"",
      inner:[ { id:"tvscreen", x:50, y:0, w:50, h:60, text:"", sound:"",
        next:{ image:"notebook.jpg", caption:"",
          inner:[ { id:"notebook", x:49, y:45, w:27, h:19, text:"Defteri al", sound:"rustle", action:"take" } ] } } ] },
    { id:"window", x:76, y:0, w:17, h:25,
      text:"Tipik Forks, yağmur, yağmur, yine yağmur.", image:"", caption:"", sound:"" },
    { id:"sink", x:37.5, y:17, w:7.5, h:11,
      text:"Diş fırçası ve tıraş bıçağı… İlginç bir şey yok. Yine de lavabonun altına bir baksam mı?", view:"sink", sound:"drawer" },
    { id:"pillows", x:6, y:27.5, w:27, h:12,
      text:"Yastığın altına bir şey saklamış olabilir mi?", image:"pillows.jpg", caption:"Hiçbir şey yokmuş...", sound:"rustle" },
    { id:"clothes", x:14, y:39.5, w:30, h:21,
      text:"Bu markayı biliyorum. Günlük kıyafetler gibi görünüyor ama tek bir ceketi iki aylık maaşım kadar.",
      image:"", caption:"", sound:"rustle" },
    { id:"charger", x:2.5, y:47, w:8, h:19,
      text:"Şarj aleti burada ama telefon ortada yok…", image:"", caption:"", sound:"" },
    { id:"nightstand", x:0, y:37, w:8.5, h:10,
      text:"Komodinin içinde ne var?", image:"drawer.jpg", caption:"Komodinler boş.", sound:"drawer" },
    { id:"bag", x:7, y:63, w:35, h:32,
      text:"Bennet burada olsaydı içine bakmaya cesaret edemezdim. Ama dışarı çıktığına göre bir göz atabilirim.",
      view:"bag", sound:"rustle" },
    { id:"map", x:61, y:59.5, w:27, h:25,
      text:"Olimpik Yarımadası'nın haritası. Üzerine bir sürü işaret koymuş. Acaba neyi araştırıyordu?",
      image:"", caption:"", sound:"paper" },
    { id:"lens", x:74, y:48, w:14.5, h:11,
      text:"Vay be, şu objektife bak! İşte buna para verilir! Keşke bütçem yetse…",
      image:"", caption:"", sound:"" },
    { id:"mug", x:89, y:54, w:7, h:11,
      text:"Kahvesine dokunmadan çıkıp gitmiş. Belli ki acelesi vardı.", image:"", caption:"", sound:"" }
  ]
};
/* Крупные планы. Сумка: фото (лицо → оборот, забрать) → снова сумка → удостоверение (забрать).
   После того как фото забрано, выйти в комнату нельзя, пока не забрано удостоверение. */
const VIEWS = {
  bag:        { image:"bag.jpg", caption:"",
                inner:[ { id:"bagin", x:8, y:8, w:84, h:82, text:"", sound:"rustle", action:"bagSearch" } ] },
  photoFront: { image:"photo_front.jpg", caption:"Ne mutlu bir çift! Neresi acaba?",
                inner:[ { id:"photo", x:25, y:19, w:70, h:57, text:"", sound:"paper", go:"photoBack" } ] },
  photoBack:  { image:"photo_back.jpg", caption:"Glacier… Ha, Montana’daki o kocaman milli park. Bu fotoğrafı yanıma alayım, işime yarar.",
                inner:[ { id:"photoback", x:0, y:0, w:100, h:100, text:"", sound:"paper", action:"takePhoto" } ] },
  idcard:     { image:"idcard.jpg", caption:"Park çalışanına ait bir kimlik kartı…",
                inner:[ { id:"card", x:30, y:20, w:61, h:53, text:"Kartı al", sound:"", action:"takeCard" } ] },
  sink:       { image:"undersink.jpg", caption:"",
                inner:[ { id:"towels", x:18, y:46, w:54, h:36, text:"", sound:"rustle",
                  next:{ image:"money.jpg", caption:"Tam sekiz bin dolar… Bu kadar parayı böyle ucuz bir motelde bırakıp gitmiş. Hem de havluların arkasına saklayarak!" } } ] }
};
const STATE = { photoTaken:false, cardTaken:false, locked:false };
const ACTIONS = {
  bagSearch(){ if(!STATE.photoTaken) return openView(VIEWS.photoFront); if(!STATE.cardTaken) return openView(VIEWS.idcard); },
  takePhoto(){ STATE.photoTaken=true; STATE.locked=true; openView(VIEWS.bag); },
  takeCard(){ STATE.cardTaken=true; STATE.locked=false; document.body.classList.remove('locked'); closeModal(); },
  take(){ closeModal(); }
};
const EDIT = new URLSearchParams(location.search).has('edit');

/* ============ ЗВУК (Web Audio, без файлов) ============ */
let ctx, master, rainNode, muted=false;
function audio(){ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=1; master.connect(ctx.destination);} return ctx; }
function noiseBuffer(sec, color){
  const c=audio(), n=c.sampleRate*sec, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); let last=0;
  for(let i=0;i<n;i++){ const w=Math.random()*2-1; if(color==='brown'){ last=(last+0.02*w)/1.02; d[i]=last*3.5; } else d[i]=w; }
  return b;
}
function pinkBuffer(sec){
  const c=audio(), n=c.sampleRate*sec, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<n;i++){ const w=Math.random()*2-1;
    b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.96900*b2+w*.1538520; b3=.86650*b3+w*.3104856;
    b4=.55000*b4+w*.5329522; b5=-.7616*b5-w*.0168980; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926; }
  return b;
}
function startRain(){
  const c=audio();
  if(SCENE.rain && SCENE.rain!=='rain'){
    // файл дождя: бесшовная петля через Web Audio, мягкое нарастание
    const g=c.createGain(); g.gain.value=0; g.connect(master);
    fetch(SCENE.rain).then(r=>r.arrayBuffer()).then(buf=>c.decodeAudioData(buf)).then(ab=>{
      const src=c.createBufferSource(); src.buffer=ab; src.loop=true; src.connect(g); src.start();
      g.gain.setValueAtTime(0,c.currentTime); g.gain.linearRampToValueAtTime(.8, c.currentTime+4);
      rainNode={stop(){src.stop();}};
    }).catch(()=>{ SCENE.rain='rain'; startRain(); });
    return; }
  // мягкий ровный шелест: розовый шум, срезанные верха, медленное «дыхание» громкости
  const src=c.createBufferSource(); src.buffer=pinkBuffer(6); src.loop=true;
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1600; lp.Q.value=.3;
  const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=180;
  const g=c.createGain(); g.gain.value=0; g.gain.linearRampToValueAtTime(.16, c.currentTime+6);
  const lfo=c.createOscillator(), lfoG=c.createGain(); lfo.frequency.value=.07; lfoG.gain.value=.03; lfo.connect(lfoG).connect(g.gain); lfo.start();
  src.connect(hp).connect(lp).connect(g).connect(master); src.start();
  // редкие тихие капли по подоконнику
  (function drops(){ if(!ctx) return; const t=c.currentTime; const o=c.createBufferSource(); o.buffer=noiseBuffer(.02,'white');
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800+Math.random()*1400; f.Q.value=4;
    const gg=c.createGain(); gg.gain.setValueAtTime(.006+Math.random()*.012,t); gg.gain.exponentialRampToValueAtTime(.0005,t+.05);
    o.connect(f).connect(gg).connect(master); o.start(t); setTimeout(drops, 180+Math.random()*700); })();
  rainNode={stop(){src.stop();}};
}
function burst(dur, f1, f2, q, vol, type='bandpass'){
  const c=audio(), t=c.currentTime, s=c.createBufferSource(); s.buffer=noiseBuffer(dur,'white');
  const f=c.createBiquadFilter(); f.type=type; f.Q.value=q; f.frequency.setValueAtTime(f1,t); f.frequency.linearRampToValueAtTime(f2,t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+dur*.15); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f).connect(g).connect(master); s.start(t);
}
function thud(freq, vol, dur){ const c=audio(), t=c.currentTime, o=c.createOscillator(), g=c.createGain();
  o.type='sine'; o.frequency.setValueAtTime(freq,t); o.frequency.exponentialRampToValueAtTime(freq*.5,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(master); o.start(t); o.stop(t+dur); }
const SFX = {
  door(){ // скрип двери: «прилипание-срыв» с переменной частотой через резонансный фильтр
    const c=audio(), dur=1.7, n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    let t=0; while(t<dur){ const prog=t/dur, rate=38+70*Math.sin(Math.PI*prog)+Math.random()*8;
      const i0=Math.floor(t*c.sampleRate), amp=(0.5+0.5*Math.sin(Math.PI*prog))*(0.7+Math.random()*0.3);
      for(let k=0;k<220 && i0+k<n;k++) d[i0+k]+=amp*Math.exp(-k/38)*(Math.random()*2-1);
      t+=1/rate; }
    const s=c.createBufferSource(); s.buffer=b;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=9; f.frequency.setValueAtTime(650,c.currentTime); f.frequency.linearRampToValueAtTime(1150,c.currentTime+dur*.6); f.frequency.linearRampToValueAtTime(800,c.currentTime+dur);
    const f2=c.createBiquadFilter(); f2.type='peaking'; f2.frequency.value=2300; f2.Q.value=6; f2.gain.value=8;
    const g=c.createGain(); g.gain.value=.55; s.connect(f).connect(f2).connect(g).connect(master); s.start();
  },
  rustle(){ for(let i=0;i<5;i++) setTimeout(()=>burst(.18+Math.random()*.15, 1800, 3500, .9, .35), i*90); },
  drawer(){ burst(.55, 400, 900, 2.5, .45); setTimeout(()=>thud(90,.6,.25),520); },
  paper(){ burst(.35, 3000, 6000, 1.2, .3, 'highpass'); },
  wood(){ thud(140,.6,.3); burst(.12,800,600,3,.2); },
  glass(){ const c=audio(), t=c.currentTime; [1760,2637,3520].forEach((fq,i)=>{ const o=c.createOscillator(), g=c.createGain();
    o.frequency.value=fq; g.gain.setValueAtTime(.08/(i+1),t); g.gain.exponentialRampToValueAtTime(.0005,t+1.4); o.connect(g).connect(master); o.start(t); o.stop(t+1.5); }); }
};
function play(sound){ if(muted||!sound) return; if(SFX[sound]) return SFX[sound](); const a=new Audio(sound); a.volume=.9; a.play().catch(()=>{}); }

/* ============ СЦЕНА ============ */
const scene=document.getElementById('scene'), tip=document.getElementById('tip'), modal=document.getElementById('modal');
document.title = SCENE.title+' · '+SCENE.subtitle; document.getElementById('gtitle').textContent=SCENE.title; document.getElementById('gsub').textContent=SCENE.subtitle;
scene.style.setProperty('--ar', SCENE.aspect);
const bg=new Image(); bg.className='bg'; bg.src=SCENE.image; bg.alt=SCENE.title; scene.appendChild(bg);
const mframe=document.getElementById('mframe'), mimg=document.getElementById('mimg'), mcap=document.getElementById('mcap');
function makeHot(h, parent, onClick){
  const el=document.createElement('div'); el.className='hot'; el.dataset.id=h.id;
  Object.assign(el.style,{left:h.x+'%',top:h.y+'%',width:h.w+'%',height:h.h+'%'});
  el.addEventListener('mouseenter',e=>{ if(EDIT||!h.text) return; tip.textContent=h.text; tip.classList.add('on'); });
  el.addEventListener('mousemove',e=>{ tip.style.left=Math.min(e.clientX+16, innerWidth-360)+'px'; tip.style.top=(e.clientY+18)+'px'; });
  el.addEventListener('mouseleave',()=>tip.classList.remove('on'));
  el.addEventListener('click',e=>{ if(EDIT) return; e.stopPropagation(); tip.classList.remove('on'); play(h.sound); onClick(h); });
  parent.appendChild(el); return el;
}
function openView(v){   // v = {image, caption, inner}
  document.body.classList.toggle('locked', STATE.locked);
  mframe.querySelectorAll('.hot').forEach(x=>x.remove());
  mimg.src=v.image; mcap.textContent=v.caption||'';
  (v.inner||[]).forEach(h=>makeHot(h, mframe, innerClick));
  modal.classList.add('on');
}
function innerClick(h){
  if(h.next) return openView(h.next);
  if(h.go) return openView(VIEWS[h.go]);
  if(h.action && ACTIONS[h.action]) return ACTIONS[h.action](h);
  closeModal();
}
SCENE.hotspots.forEach(h=>{ makeHot(h, scene, h=>{ if(h.view) openView(VIEWS[h.view]); else if(h.image) openView(h); }); });
function preload(v){ if(v.image){ const p=new Image(); p.src=v.image; } (v.inner||[]).forEach(i=>i.next&&preload(i.next)); }
SCENE.hotspots.forEach(preload); Object.values(VIEWS).forEach(preload);
function closeModal(){ if(STATE.locked) return; modal.classList.remove('on'); tip.classList.remove('on'); }
modal.addEventListener('click',closeModal); document.getElementById('close').addEventListener('click',closeModal);
addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.getElementById('gate').addEventListener('click',function(){ audio().resume(); startRain(); this.classList.add('off'); });
document.getElementById('mute').addEventListener('click',function(){ muted=!muted; master.gain.value=muted?0:1; if(rainNode&&rainNode.el) rainNode.el.muted=muted; this.textContent=muted?'🔇':'🔊'; });

/* ============ РЕЖИМ РАЗМЕТКИ (?edit=1) ============ */
if(EDIT){
  document.body.classList.add('edit'); const box=document.getElementById('editbox'); let start=null, rect=null, n=0;
  const dump=()=>{ box.textContent='Обведите мышью место на картинке.\nСкопируйте строки в hotspots:\n\n'+
    [...scene.querySelectorAll('.draw')].map((d,i)=>`{ id:"p${i+1}", x:${d.dataset.x}, y:${d.dataset.y}, w:${d.dataset.w}, h:${d.dataset.h}, text:"", image:"", caption:"", sound:"" },`).join('\n'); };
  const pct=e=>{ const r=scene.getBoundingClientRect(); return [ (e.clientX-r.left)/r.width*100, (e.clientY-r.top)/r.height*100 ]; };
  scene.addEventListener('mousedown',e=>{ start=pct(e); rect=document.createElement('div'); rect.className='draw'; scene.appendChild(rect); e.preventDefault(); });
  addEventListener('mousemove',e=>{ if(!start) return; const p=pct(e); const x=Math.min(start[0],p[0]), y=Math.min(start[1],p[1]), w=Math.abs(p[0]-start[0]), h=Math.abs(p[1]-start[1]);
    Object.assign(rect.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'}); Object.assign(rect.dataset,{x:x.toFixed(1),y:y.toFixed(1),w:w.toFixed(1),h:h.toFixed(1)}); });
  addEventListener('mouseup',()=>{ if(start){ start=null; if(!rect.dataset.w || +rect.dataset.w<0.5) rect.remove(); dump(); } });
  dump();
}
</script>
</body>
</html>
