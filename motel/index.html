<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sedar Creek Motel</title>
<style>
  :root { --glow:rgba(190,220,210,.55); --fog:#9fb3b0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0b1110; color:#e8efe9; font-family: Georgia, "Times New Roman", serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #scene { position:relative; width:min(100vw, calc(100vh * var(--ar))); aspect-ratio: var(--ar); }
  #scene > .bg { position:absolute; inset:0; width:100%; height:100%; display:block; filter:saturate(.85) brightness(.95); user-select:none; -webkit-user-drag:none; }
  .hot { position:absolute; cursor:pointer; border-radius:10px; transition: box-shadow .35s, background .35s; }
  .hot.nohand { cursor:default; }
  .hot:hover { box-shadow: 0 0 22px 6px var(--glow) inset, 0 0 18px 2px var(--glow); background: rgba(200,230,220,.06); }
  body.edit .hot { outline:1px dashed #ffd27a; }
  #tip { position:fixed; z-index:15; pointer-events:none; max-width:360px; padding:12px 16px; font-size:16px; line-height:1.45;
    background:#fff; color:#1b1b1b; border-radius:4px; box-shadow:0 8px 28px rgba(0,0,0,.55); opacity:0; transition:opacity .25s; font-style:italic; }
  #tip.on { opacity:1; }
  #note { position:absolute; left:50%; bottom:3.5%; transform:translateX(-50%); z-index:4; max-width:80%; text-align:center;
    background:#fff; color:#1b1b1b; padding:12px 20px; border-radius:4px; font-size:17px; font-style:italic; line-height:1.4;
    box-shadow:0 8px 28px rgba(0,0,0,.6); pointer-events:none; opacity:0; transition:opacity 1.2s; }
  #note.on { opacity:1; }
  #modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:10; background:rgba(4,8,8,.88); backdrop-filter: blur(3px); }
  #modal.on { display:flex; animation: fade .35s ease; }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  #modal figure { margin:0; max-width:92vw; max-height:92vh; text-align:center; }
  #mframe { position:relative; display:inline-block; line-height:0; }
  #mframe .hot { z-index:2; }
  #mimg, #mvid { max-width:92vw; max-height:78vh; border-radius:6px; box-shadow:0 10px 50px rgba(0,0,0,.8); }
  #mvid { display:none; background:#000; }
  #modal figcaption { margin-top:14px; font-size:17px; font-style:italic; color:#cfdcd7; }
  #close { position:fixed; top:14px; right:18px; font-size:34px; color:#cfdcd7; cursor:pointer; z-index:11; display:none; user-select:none; }
  #modal.on ~ #close { display:block; }
  #gate { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, rgba(20,32,30,.92), rgba(4,8,8,.98)); cursor:pointer; text-align:center; padding:20px; }
  #gate h1 { font-weight:normal; letter-spacing:.12em; font-size: clamp(26px,5vw,48px); margin:0 0 28px; color:#dfe9e4; }
  #gate p { color:var(--fog); font-style:italic; margin:0; font-size:15px; opacity:.85; }
  #gate.off { opacity:0; pointer-events:none; transition:opacity 1.2s; }
  #mute { position:fixed; left:16px; bottom:14px; z-index:6; font-size:22px; cursor:pointer; opacity:.7; user-select:none; }
</style>
</head>
<body>
<div id="stage"><div id="scene"><div id="note"></div></div></div>
<div id="tip"></div>
<div id="modal"><figure><div id="mframe"><img id="mimg" alt=""><video id="mvid" controls playsinline preload="auto">
  <source src="cctv.webm" type="video/webm"><source src="cctv.mp4" type="video/mp4"></video></div><figcaption id="mcap"></figcaption></figure></div>
<div id="close" title="Kapat">×</div>
<div id="mute" title="Ses">🔊</div>
<div id="gate"><h1>Sedar Creek Motel</h1><p>Girmek için tıklayın 🔊</p></div>

<script>
/* Координаты точек — проценты от картинки: x,y = левый верхний угол, w,h = размер. ?edit=1 показывает рамки. */
const SCENE = {
  image: "motel.jpg", aspect: 1280/853,
  rain: "ambient.mp3", rainVolume: .75,   // фон: шум у дороги из видео Марии (03.10)
  note: "Motelin güvenlik kameraları çalışmıyor. Ama yine de belki yakınlarda başka bir kamera vardır.",
  hotspots: [
    { id:"sign",    x:6.5, y:21,  w:10.5, h:11.5, text:"BOŞ ODALAR — KABLOLU TV — BEDAVA KAHVE. En inandırıcı kısmı ‘boş odalar’." },
    { id:"office",  x:30.5,y:36.5,w:11.5, h:16.5, text:"Bennet bütün gün burada oturup sinek avlıyor." },
    { id:"pickup",  x:78,  y:31,  w:12.5, h:10,   text:"Şu kırmızı pikaba bak… Yanına ‘SATILIK’ ilanı asmışlar." },
    { id:"police",  x:42,  y:40.5,w:14.5, h:11.5, text:"Araba şimdilik burada kalsın." },
    { id:"gas",     x:77,  y:73,  w:23,   h:27,   text:"Tadilat nedeniyle kapalıymış." },
    { id:"laundry", x:65.5,y:46,  w:34,   h:25,   text:"Belki buradaki güvenlik kameraları çalışıyordur. Bir sormaya değer.", click:"cameras" }
  ]
};
const VIEWS = {
  cameras: { image:"cameras.jpg", caption:"",
             inner:[ { id:"monitor", x:17, y:4, w:69, h:78, text:"Çamaşırhane kamera kaydını izle", go:"video" } ] },
  video:   { video:true, caption:"Burada bir tuhaflık var..." }
};
const EDIT = new URLSearchParams(location.search).has('edit');
if(EDIT) document.body.classList.add('edit');

/* ---------- звук ---------- */
let ctx, master, rainGain, muted=false;
function audio(){ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.connect(ctx.destination);} return ctx; }
function startRain(){
  const c=audio(); rainGain=c.createGain(); rainGain.gain.value=0; rainGain.connect(master);
  fetch(SCENE.rain).then(r=>r.arrayBuffer()).then(b=>c.decodeAudioData(b)).then(buf=>{
    const s=c.createBufferSource(); s.buffer=buf; s.loop=true; s.connect(rainGain); s.start();
    rainGain.gain.linearRampToValueAtTime(SCENE.rainVolume, c.currentTime+4);
  }).catch(()=>{});
}
function duck(on){ if(!rainGain) return; const t=audio().currentTime; rainGain.gain.cancelScheduledValues(t);
  rainGain.gain.setValueAtTime(rainGain.gain.value,t); rainGain.gain.linearRampToValueAtTime(on?0.06:SCENE.rainVolume, t+.6); }

/* ---------- сцена ---------- */
const scene=document.getElementById('scene'), tip=document.getElementById('tip'), modal=document.getElementById('modal');
const mframe=document.getElementById('mframe'), mimg=document.getElementById('mimg'), mvid=document.getElementById('mvid'), mcap=document.getElementById('mcap');
scene.style.setProperty('--ar', SCENE.aspect);
const bg=new Image(); bg.className='bg'; bg.src=SCENE.image; bg.alt='Sedar Creek Motel'; scene.prepend(bg);
document.getElementById('note').textContent=SCENE.note;
function makeHot(h, parent, onClick){
  const el=document.createElement('div'); el.className='hot'+(onClick?'':' nohand'); el.dataset.id=h.id;
  Object.assign(el.style,{left:h.x+'%',top:h.y+'%',width:h.w+'%',height:h.h+'%'});
  el.addEventListener('mouseenter',()=>{ if(!h.text) return; tip.textContent=h.text; tip.classList.add('on'); });
  el.addEventListener('mousemove',e=>{ tip.style.left=Math.min(e.clientX+16, innerWidth-380)+'px'; tip.style.top=Math.min(e.clientY+18, innerHeight-120)+'px'; });
  el.addEventListener('mouseleave',()=>tip.classList.remove('on'));
  if(onClick) el.addEventListener('click',e=>{ e.stopPropagation(); tip.classList.remove('on'); onClick(h); });
  parent.appendChild(el); return el;
}
let current=null;
function openView(v){
  current=v; mframe.querySelectorAll('.hot').forEach(x=>x.remove());
  if(v.video){ mimg.style.display='none'; mvid.style.display='block'; mvid.currentTime=0; duck(true); mvid.muted=muted; mvid.play().catch(()=>{}); }
  else { mvid.pause(); mvid.style.display='none'; mimg.style.display='block'; mimg.src=v.image; duck(false); }
  mcap.textContent=v.caption||'';
  (v.inner||[]).forEach(h=>makeHot(h, mframe, h=>openView(VIEWS[h.go])));
  modal.classList.add('on');
}
function closeModal(){ mvid.pause(); duck(false); modal.classList.remove('on'); tip.classList.remove('on'); current=null; }
SCENE.hotspots.forEach(h=>makeHot(h, scene, h.click ? (h=>openView(VIEWS[h.click])) : null));
/* видео закрывается ТОЛЬКО крестиком; картинка камер — ещё и щелчком мимо / Esc */
modal.addEventListener('click',e=>{ if(current && !current.video && e.target===modal) closeModal(); });
addEventListener('keydown',e=>{ if(e.key==='Escape' && current && !current.video) closeModal(); });
document.getElementById('close').addEventListener('click',closeModal);
new Image().src='cameras.jpg';
document.getElementById('gate').addEventListener('click',function(){
  audio().resume(); startRain(); this.classList.add('off');
  setTimeout(()=>document.getElementById('note').classList.add('on'), 1200);
});
document.getElementById('mute').addEventListener('click',function(){ muted=!muted; if(master) master.gain.value=muted?0:1; mvid.muted=muted; this.textContent=muted?'🔇':'🔊'; });
</script>
</body>
</html>
